name: Deploy to EC2

on:
  push:
    branches: [main]

# Prevent overlapping deployments — cancel in-progress if a new push comes in
concurrency:
  group: eligo-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "→ Navigating to project"
            cd ~/eligo

            echo "→ Stashing any local changes"
            git stash push --include-untracked || true

            echo "→ Pulling latest code"
            git pull origin main

            echo "→ Installing backend dependencies"
            cd backend
            npm ci --only=production

            echo "→ Restarting Eligo service"
            sudo systemctl restart eligo

            echo "→ Checking service health"
            sleep 3
            if sudo systemctl is-active eligo --quiet; then
              echo "✓ systemd service is active"
            else
              echo "✗ systemd service failed to start"
              sudo systemctl status eligo --no-pager
              exit 1
            fi

            echo "→ Checking HTTP health endpoint"
            for i in 1 2 3 4 5; do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health 2>/dev/null || echo "000")
              if [ "$HTTP_CODE" = "200" ]; then
                echo "✓ HTTP /api/health responds 200 (attempt $i)"
                break
              fi
              echo "  Waiting… (attempt $i, got $HTTP_CODE)"
              sleep 2
            done

            if [ "$HTTP_CODE" != "200" ]; then
              echo "✗ HTTP health check failed after 5 attempts"
              sudo journalctl -u eligo --no-pager -n 30
              exit 1
            fi

            echo "✓ Deployment complete"
